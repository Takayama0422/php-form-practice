name: Security verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4'
          ini-values: session.upload_progress.enabled=0
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test HTTP validation and escaping
        run: python3 tests/security_http.py
